name: Telegram autopost

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (минимум, который даёт GitHub)
  workflow_dispatch:         # кнопка ручного запуска

permissions:
  contents: write            # чтобы сохранять posted.json с уже опубликованными новостями

concurrency:
  group: tg-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Post new items
        run: python autopost.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}                     # общий бот для всех каналов
          TG_TOKEN_NBA365: ${{ secrets.TG_TOKEN_NBA365 }}       # отдельные боты (если есть)
          TG_TOKEN_NHL365: ${{ secrets.TG_TOKEN_NHL365 }}
          TG_TOKEN_F1NEWS365: ${{ secrets.TG_TOKEN_F1NEWS365 }}
          TG_TOKEN_NFL365: ${{ secrets.TG_TOKEN_NFL365 }}
          TG_TOKEN_EPL365: ${{ secrets.TG_TOKEN_EPL365 }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          if ! git diff --cached --quiet; then
            git commit -m "update posted state"
            git pull --rebase
            git push
          fi
